ktor:
  application:
    modules:
      - org.darthacheron.pantrypal.server.ApplicationKt.module
  deployment:
    port: 8080

keycloak:
  # The base URL for Keycloak (internal for server-to-server, external for browser redirects)
  baseUrl: ${KEYCLOAK_AUTHORITY:-http://localhost:18080/realms/pantry_pal}
  clientId: ${KEYCLOAK_CLIENT_ID:-PantryPal}
  realm: ${KEYCLOAK_REALM:-pantry_pal}

jwt:
  # The issuer expected in the JWT (must match the 'iss' claim from Keycloak)
  domain: ${KEYCLOAK_VALID_ISSUER:-http://localhost:18080/realms/pantry_pal}
  audience: ${KEYCLOAK_AUDIENCE:-PantryPal}
  realm: ${KEYCLOAK_REALM:-pantry_pal}

postgres:
  url: ${SERVER_CONNECTION_STRING:-jdbc:postgresql://localhost/pantry_pal}
  user: ${POSTGRES_USER:-username}
  password: ${POSTGRES_PASSWORD:-password}
